appId: com.tradinglab.app
productName: Trading Lab
executableName: trading-lab
copyright: Copyright (c) jaimie garner
directories:
  output: release
  buildResources: build
# the renderer is bundled by Vite into out/; only the two main-process SDKs ship as node_modules
files:
  - out/**/*
  - package.json
asar: true
npmRebuild: false
electronDist: node_modules/electron/dist
electronVersion: 44.5.1
linux:
  target:
    - AppImage
    - deb
  category: Office
  syncDesktopName: true
  icon: build/icon.png
  maintainer: jaimie <pacificnm@gmail.com>
  synopsis: Paper-trading learning tool with charts and a Claude assistant
  desktop:
    entry:
      Name: Trading Lab
      Comment: Learn trading with paper money, charts and Claude
      Keywords: trading;stocks;charts;learning;paper trading;
      StartupWMClass: trading-lab
      Categories: Office;Finance;
appImage:
  artifactName: Trading-Lab-${version}-${arch}.AppImage
deb:
  artifactName: trading-lab_${version}_${arch}.deb
  depends: [libgtk-3-0, libnotify4, libnss3, libxss1, libxtst6, xdg-utils, libatspi2.0-0, libuuid1, libsecret-1-0, libasound2t64 | libasound2]
