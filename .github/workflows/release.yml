name: Release

# Pushing a tag like v1.2.3 builds the Linux, Windows and macOS packages and publishes them as a GitHub release.
# The app's "Check for updates" reads that release, so the tag must match app/package.json's version.
on:
  push:
    tags: ['v*']
  # dry run: builds every platform and keeps the files as workflow artifacts, but publishes nothing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    # the Electron app lives in app/ (the website is in site/ and is not part of a release)
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Tag must match package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version $v"; exit 1; }
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run dist
      - uses: actions/upload-artifact@v5
        with:
          name: packages-${{ matrix.os }}
          path: |
            app/release/*.AppImage
            app/release/*.deb
            app/release/*.exe
            app/release/*.dmg

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" \
            --title "Trading Lab ${GITHUB_REF_NAME#v}" --generate-notes
